name: auth-service CI

on:
  pull_request:
    branches: [main, t3]
  push:
    branches: [main, t3]

permissions:
  contents: read
  security-events: write

env:
  SERVICE_NAME: auth-service
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GITOPS_REPO: jobucaldas/3DCLT-TC
  GITOPS_BRANCH: t3

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -coverprofile=coverage.out

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gotest-${{ github.sha }}
          path: coverage.out
          retention-days: 7
          overwrite: true
  lint:
    name: Lint
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
  sca:
    name: SCA dependency scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: SCA dependency scan
        continue-on-error: true
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
  sast:
    name: SAST with gosec
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: SAST with gosec
        uses: securego/gosec@v2.22.9
        with:
          args: "-severity high -confidence medium ./..."
  trivy-fs:
    name: Trivy filesystem scan
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-${{ github.sha }}
          path: trivy-fs.sarif
          retention-days: 7
          overwrite: true

      - name: Upload Trivy filesystem SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
  docker-build:
    name: Docker build
    needs: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker build
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ github.sha }} .
      - name: Save image artifact
        run: docker save ${{ env.SERVICE_NAME }}:${{ github.sha }} -o /tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: /tmp/image.tar
          retention-days: 1
          overwrite: true
  trivy-image:
    name: Trivy image scan
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: /tmp
      - name: Load image artifact
        run: docker load -i /tmp/image.tar
      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Upload Trivy image SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ github.sha }}
          path: trivy-image.sarif
          retention-days: 7
          overwrite: true

      - name: Upload Trivy image SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
  publish:
    name: Publish and update GitOps
    needs: trivy-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: /tmp
      - name: Load image artifact
        run: docker load -i /tmp/image.tar
      - name: Push image to ECR
        if: github.event_name == 'push'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name ${{ env.SERVICE_NAME }} --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "tag exists, skip push"
          else
            docker tag ${{ env.SERVICE_NAME }}:${{ github.sha }} "$IMAGE_URI"
            docker push "$IMAGE_URI"
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      - name: Update GitOps image tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Install yq
        if: github.event_name == 'push'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Commit GitOps image tag
        if: github.event_name == 'push'
        working-directory: gitops
        run: |
          yq -i '(.spec.template.spec.containers[] | select(.name == env(SERVICE_NAME)) | .image) = env(IMAGE_URI)' k8s/app/${{ env.SERVICE_NAME }}/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app/${{ env.SERVICE_NAME }}/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): update ${{ env.SERVICE_NAME }} image to ${{ github.sha }}"
          success=false
          for _ in 1 2 3 4 5; do
            git rebase --abort || true
            if git pull --rebase origin ${{ env.GITOPS_BRANCH }}; then
              if git push origin HEAD:${{ env.GITOPS_BRANCH }}; then
                success=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo "GitOps push failed after retries"
            exit 1
          fi
