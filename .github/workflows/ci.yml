name: auth-service CI

on:
  pull_request:
    branches: [main, t3]
  push:
    branches: [main, t3]

permissions:
  contents: read
  security-events: write

env:
  SERVICE_NAME: auth-service
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GITOPS_REPO: jobucaldas/3DCLT-TC
  GITOPS_BRANCH: t3

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./...
  lint:
    name: Lint
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
  sca:
    name: SCA dependency scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: SCA dependency scan
        continue-on-error: true
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
  sast:
    name: SAST with gosec
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: SAST with gosec
        uses: securego/gosec@v2.22.9
        with:
          args: "-severity high -confidence medium ./..."
  trivy-fs:
    name: Trivy filesystem scan
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
  docker-build:
    name: Docker build
    needs: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker build
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ github.sha }} .
      - name: Save image artifact
        run: docker save ${{ env.SERVICE_NAME }}:${{ github.sha }} -o /tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: /tmp/image.tar
          retention-days: 1
          overwrite: true
  trivy-image:
    name: Trivy image scan
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: /tmp
      - name: Load image artifact
        run: docker load -i /tmp/image.tar
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
  publish:
    name: Publish and update GitOps
    needs: trivy-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: /tmp
      - name: Load image artifact
        run: docker load -i /tmp/image.tar
      - name: Push image to ECR
        if: github.event_name == 'push'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name ${{ env.SERVICE_NAME }} --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "tag exists, skip push"
          else
            docker tag ${{ env.SERVICE_NAME }}:${{ github.sha }} "$IMAGE_URI"
            docker push "$IMAGE_URI"
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Checkout GitOps repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Install yq
        if: github.event_name == 'push'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create GitOps pull request
        if: github.event_name == 'push'
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="gitops/${SERVICE_NAME}-${SHORT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          yq -i '(.spec.template.spec.containers[] | select(.name == env(SERVICE_NAME)) | .image) = env(IMAGE_URI)' \
            "k8s/app/${SERVICE_NAME}/deployment.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "k8s/app/${SERVICE_NAME}/deployment.yaml"

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(gitops): update ${SERVICE_NAME} image"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GITOPS_REPO" \
            --base "$GITOPS_BRANCH" \
            --head "$BRANCH" \
            --title "chore(gitops): update ${SERVICE_NAME}" \
            --body "Atualiza ${SERVICE_NAME} para ${IMAGE_URI}."
